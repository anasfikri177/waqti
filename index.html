<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>وقتي</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--p:#4f46e5;--pd:#4338ca;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--err:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
button,input,select,textarea{font:inherit}
header{background:var(--p);color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav{display:flex;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:13px 6px;border:0;background:none;font-size:14px;cursor:pointer;color:var(--m);border-bottom:3px solid transparent}
nav button.on{color:var(--p);font-weight:700;border-bottom-color:var(--p)}
main{max-width:720px;margin:0 auto;padding:14px}
label{display:block;font-size:13px;color:var(--m);margin-top:6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;font-size:16px;margin:4px 0 8px;background:#fff;color:var(--t)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.chip{white-space:nowrap;padding:6px 14px;border-radius:99px;border:1px solid var(--b);background:#fff;cursor:pointer;font-size:13px;color:var(--t)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.start{justify-content:flex-start}
.grow{flex:1;min-width:0}
.mt{margin-top:10px}
.av{width:46px;height:46px;border-radius:50%;background:#e0e7ff;color:var(--p);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.sub{color:var(--m);font-size:13px}
.btn{background:var(--p);color:#fff;border:1px solid var(--p);padding:9px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--pd)}
.btn.g{background:#fff;color:var(--p)}
.price{font-weight:700;color:var(--p)}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:#dcfce7;color:#166534}
.badge.off{background:#f3f4f6;color:var(--m)}
.empty{text-align:center;color:var(--m);padding:34px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 2px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.slot{padding:9px 6px;border:1px solid var(--b);border-radius:10px;text-align:center;cursor:pointer;font-size:13px;background:#fff;color:var(--t)}
.slot.on{background:var(--p);color:#fff;border-color:var(--p)}
.slot:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:#f9fafb;border-radius:12px;padding:12px;margin:8px 0}
.err{color:var(--err);font-size:13px;min-height:20px;margin:2px 0 6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>⏱️ وقتي</h1>
  <p>بع مهارتك في جلسات قصيرة، أو احجز خبيرًا في دقائق</p>
</header>
<nav id="nav">
  <button data-act="tab" data-tab="home">الخبراء</button>
  <button data-act="tab" data-tab="book">حجوزاتي <span id="count"></span></button>
  <button data-act="tab" data-tab="join">كن خبيرًا</button>
</nav>
<main id="view"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
"use strict";
const FEE = 0.15;
const CUR = "درهم";
const KEY = "waqti.v1";
const JITSI = "https://meet.jit.si/";
const CATS = ["الكل", "سيرة ذاتية", "لغات", "برمجة", "قانون", "رياضة", "تسويق"];
const SEED = [
  {id: 1, name: "سلمى بنعلي", skill: "مراجعة السيرة الذاتية والتحضير للمقابلات", cat: "سيرة ذاتية", price: 80, min: 30, rating: 4.9},
  {id: 2, name: "Youssef Amrani", skill: "Conversation en français niveau B2", cat: "لغات", price: 60, min: 30, rating: 4.7},
  {id: 3, name: "أمين الإدريسي", skill: "مراجعة كود JavaScript و React", cat: "برمجة", price: 120, min: 30, rating: 4.8},
  {id: 4, name: "نادية العلمي", skill: "استشارة قانونية أولية (عقود وشغل)", cat: "قانون", price: 150, min: 20, rating: 4.6},
  {id: 5, name: "ياسين الكوتش", skill: "برنامج تمارين منزلي مخصص", cat: "رياضة", price: 70, min: 20, rating: 4.5},
  {id: 6, name: "ريم الفاسي", skill: "خطة تسويق لمشروعك على إنستغرام", cat: "تسويق", price: 100, min: 30, rating: 4.8}
];
const okExpert = e => e && typeof e.name === "string" && typeof e.skill === "string" && CATS.includes(e.cat) && Number.isFinite(e.price) && Number.isFinite(e.min);
const okBooking = b => b && typeof b.id === "string" && typeof b.expert === "string" && typeof b.skill === "string" && Number.isFinite(Date.parse(b.slot)) && Number.isFinite(b.price);
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.experts) && Array.isArray(d.bookings)) {
      return {experts: d.experts.filter(okExpert), bookings: d.bookings.filter(okBooking)};
    }
  } catch (_) {}
  return {experts: SEED.map(e => ({...e})), bookings: []};
}
const S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }
const ui = {tab: "home", cat: "الكل", q: "", expert: null, slot: null};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const round2 = n => Math.round(n * 100) / 100;
const money = n => `${round2(n)} ${CUR}`;
const fmtDate = iso => new Date(iso).toLocaleString("ar-MA", {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
const safeLink = l => (typeof l === "string" && l.startsWith(JITSI)) ? l : "#";
function rid() { const a = new Uint8Array(10); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, "0")).join(""); }
function luhn(num) { let sum = 0, alt = false; for (let i = num.length - 1; i >= 0; i--) { let d = +num[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } sum += d; alt = !alt; } return sum % 10 === 0; }
function validExp(v) { const m = /^(\d{2})\/(\d{2})$/.exec(v); if (!m) return false; const mm = +m[1], yy = 2000 + (+m[2]); if (mm < 1 || mm > 12) return false; return new Date(yy, mm, 1) > new Date(); }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2500); }
function showErr(msg) { const el = $("#err"); if (el) el.textContent = msg; return false; }
function expertCard(e) {
  return `<article class="card"><div class="row start"><div class="av" aria-hidden="true">${esc([...e.name][0] || "؟")}</div><div class="grow"><b>${esc(e.name)}</b><span class="sub">${e.rating ? "⭐ " + e.rating : "🆕 جديد"}</span><div class="sub">${esc(e.skill)}</div></div></div><div class="row mt"><span class="price">${money(e.price)} / ${e.min} د</span><button class="btn" data-act="book" data-id="${esc(e.id)}">احجز</button></div></article>`;
}
function viewHome() { return `<label class="sr" for="q">بحث</label><input id="q" type="search" placeholder="🔍 ابحث عن مهارة أو خبير..." value="${esc(ui.q)}" autocomplete="off"><div class="chips" id="chips"></div><div id="list"></div>`; }
function renderChips() { $("#chips").innerHTML = CATS.map(c => `<button class="chip${c === ui.cat ? " on" : ""}" data-act="cat" data-cat="${esc(c)}">${esc(c)}</button>`).join(""); }
function renderList() { const q = ui.q.trim().toLowerCase(); const list = S.experts.filter(e => (ui.cat === "الكل" || e.cat === ui.cat) && (e.name + " " + e.skill).toLowerCase().includes(q)); $("#list").innerHTML = list.length ? list.map(expertCard).join("") : `<div class="empty">لا توجد نتائج مطابقة.</div>`; }
function viewBook() {
  if (!S.bookings.length) { return `<div class="empty">لا توجد حجوزات بعد.<br><button class="btn mt" data-act="tab" data-tab="home">تصفح الخبراء</button></div>`; }
  const now = Date.now();
  return [...S.bookings].sort((a, b) => Date.parse(a.slot) - Date.parse(b.slot)).map(b => { const over = Date.parse(b.slot) + (b.min || 30) * 60000 < now; return `<article class="card"><div class="row"><b>${esc(b.expert)}</b><span class="badge${over ? " off" : ""}">${over ? "منتهية" : "قادمة"}</span></div><div class="sub">${esc(b.skill)}</div><div class="sub mt">📅 ${esc(fmtDate(b.slot))} · ${money(b.price)}</div><div class="row start mt">${over ? "" : `<a class="btn" href="${esc(safeLink(b.link))}" target="_blank" rel="noopener noreferrer">🎥 ابدأ الجلسة</a>`}<button class="btn g" data-act="cancel" data-id="${esc(b.id)}">${over ? "حذف" : "إلغاء"}</button></div></article>`; }).join("");
}
function viewJoin() { return `<form class="card" id="jf" novalidate><h3 style="margin-top:0">سجّل كخبير</h3><label for="jn">الاسم</label><input id="jn" maxlength="60" autocomplete="name"><label for="js">وصف الجلسة</label><textarea id="js" rows="2" maxlength="120" placeholder="مثال: مراجعة مشروع التخرج"></textarea><label for="jc">التصنيف</label><select id="jc">${CATS.slice(1).map(c => `<option>${esc(c)}</option>`).join("")}</select><div class="two"><div><label for="jp">السعر (${CUR})</label><input id="jp" type="number" min="10" max="5000" step="1" value="50" inputmode="numeric"></div><div><label for="jm">المدة</label><select id="jm"><option value="15">15 دقيقة</option><option value="30" selected>30 دقيقة</option></select></div></div><div class="sub">ستحصل على ${100 - FEE * 100}% من سعر كل جلسة.</div><div id="err" class="err" role="alert"></div><button class="btn" type="submit">نشر ملفي</button></form>`; }
function render() { const v = $("#view"); v.innerHTML = ui.tab === "home" ? viewHome() : ui.tab === "book" ? viewBook() : viewJoin(); if (ui.tab === "home") { renderChips(); renderList(); } document.querySelectorAll("#nav button").forEach(b => { const on = b.dataset.tab === ui.tab; b.classList.toggle("on", on); if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); $("#count").textContent = S.bookings.length ? `(${S.bookings.length})` : ""; }
function setTab(t) { ui.tab = t; render(); window.scrollTo(0, 0); }
function makeSlots() { const out = []; for (let d = 1; d <= 3; d++) { for (const h of [10, 14, 17]) { const dt = new Date(); dt.setDate(dt.getDate() + d); dt.setHours(h, 0, 0, 0); out.push(dt.toISOString()); } } return out; }
function openBook(id) {
  const e = S.experts.find(x => String(x.id) === id); if (!e) return; ui.expert = e; ui.slot = null;
  const taken = new Set(S.bookings.filter(b => String(b.expertId) === String(e.id)).map(b => b.slot));
  const fee = round2(e.price * FEE);
  $("#sheet").innerHTML = `<form id="bf" novalidate><h3 id="mt">حجز جلسة مع ${esc(e.name)}</h3><div class="sub">${esc(e.skill)} · ${e.min} دقيقة</div><b class="mt" style="display:block">اختر الموعد</b><div class="slots">${makeSlots().map(iso => `<button type="button" class="slot" data-act="slot" data-iso="${iso}" aria-pressed="false"${taken.has(iso) ? " disabled" : ""}>${esc(fmtDate(iso))}${taken.has(iso) ? " (محجوز)" : ""}</button>`).join("")}</div><label for="cname">الاسم الكامل</label><input id="cname" maxlength="60" autocomplete="name"><label for="card">رقم البطاقة (تجريبي)</label><input id="card" dir="ltr" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" maxlength="23"><div class="two"><div><label for="exp">الانتهاء</label><input id="exp" dir="ltr" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5"></div><div><label for="cvc">CVC</label><input id="cvc" dir="ltr" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4"></div></div><div class="sub">الدفع تجريبي: لا يتم إرسال بيانات البطاقة أو تخزينها.</div><div class="sum"><div class="row"><span>سعر الجلسة</span><b>${money(e.price)}</b></div><div class="row sub"><span>عمولة المنصة (${FEE * 100}%)</span><span>${money(fee)}</span></div><div class="row sub"><span>صافي الخبير</span><span>${money(e.price - fee)}</span></div></div><div id="err" class="err" role="alert"></div><div class="row"><button type="button" class="btn g" data-act="close">إلغاء</button><button type="submit" class="btn">ادفع ${money(e.price)}</button></div></form>`;
  $("#modal").classList.add("show");
}
function closeModal() { $("#modal").classList.remove("show"); ui.expert = null; ui.slot = null; }
function confirmBook() {
  const e = ui.expert; if (!e) return;
  const name = $("#cname").value.trim(); const card = $("#card").value.replace(/\D/g, ""); const exp = $("#exp").value.trim(); const cvc = $("#cvc").value.trim();
  if (!ui.slot) return showErr("اختر موعد الجلسة.");
  if (name.length < 2) return showErr("أدخل اسمك الكامل.");
  if (card.length < 13 || card.length > 19 || !luhn(card)) return showErr("رقم البطاقة غير صالح.");
  if (!validExp(exp)) return showErr("تاريخ الانتهاء غير صالح (MM/YY).");
  if (!/^\d{3,4}$/.test(cvc)) return showErr("رمز CVC غير صالح.");
  if (S.bookings.some(b => String(b.expertId) === String(e.id) && b.slot === ui.slot)) { return showErr("هذا الموعد لم يعد متاحًا."); }
  const id = rid();
  S.bookings.push({id, expertId: e.id, expert: e.name, skill: e.skill, slot: ui.slot, price: e.price, min: e.min, client: name, link: JITSI + "waqti-" + id});
  save(); closeModal(); setTab("book"); toast("تم تأكيد الحجز ✅");
}
function cancelBooking(id) { if (!confirm("هل تريد حذف هذا الحجز؟")) return; S.bookings = S.bookings.filter(b => b.id !== id); save(); render(); toast("تم الحذف"); }
function addExpert() {
  const name = $("#jn").value.trim(); const skill = $("#js").value.trim(); const cat = $("#jc").value; const price = Number($("#jp").value); const min = Number($("#jm").value);
  if (name.length < 2) return showErr("أدخل اسمك.");
  if (skill.length < 10) return showErr("اكتب وصفًا واضحًا للجلسة (10 أحرف على الأقل).");
  if (!Number.isInteger(price) || price < 10 || price > 5000) return showErr(`السعر بين 10 و5000 ${CUR}.`);
  S.experts.unshift({id: Date.now(), name, skill, cat, price, min, rating: null});
  save(); ui.cat = "الكل"; ui.q = ""; setTab("home"); toast("تم نشر ملفك ✅");
}
document.addEventListener("click", ev => {
  if (ev.target.id === "modal") return closeModal();
  const el = ev.target.closest("[data-act]"); if (!el) return;
  switch (el.dataset.act) {
    case "tab": setTab(el.dataset.tab); break;
    case "cat": ui.cat = el.dataset.cat; renderChips(); renderList(); break;
    case "book": openBook(el.dataset.id); break;
    case "close": closeModal(); break;
    case "cancel": cancelBooking(el.dataset.id); break;
    case "slot": ui.slot = el.dataset.iso; document.querySelectorAll(".slot").forEach(s => { s.classList.toggle("on", s === el); s.setAttribute("aria-pressed", String(s === el)); }); break;
  }
});
document.addEventListener("submit", ev => { ev.preventDefault(); if (ev.target.id === "bf") confirmBook(); else if (ev.target.id === "jf") addExpert(); });
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q") { ui.q = t.value; renderList(); }
  else if (t.id === "card") t.value = t.value.replace(/\D/g, "").slice(0, 19).replace(/(.{4})/g, "$1 ").trim();
  else if (t.id === "exp") { const d = t.value.replace(/\D/g, "").slice(0, 4); t.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeModal(); });
render();
})();
</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
</script>
</body>
</html>
