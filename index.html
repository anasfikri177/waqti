<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وقتي - Waqti</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#f6f7fb;color:#111}
header{background:#4f46e5;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:28px}
header p{opacity:.9}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;display:flex;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.card img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#ddd}
.card h3{margin:0}
.card p{margin:4px 0;color:#666;font-size:14px}
.price{font-weight:700;color:#4f46e5}
.btn{background:#4f46e5;color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;margin-top:8px}
.stars span{font-size:26px;cursor:pointer;color:#ccc}
.stars span.on{color:#FFC107}
.rating-text{font-size:13px;color:#666}
</style>
</head>
<body>
<header><h1>وقتي</h1><p>خبراء موثوقون في متناول يدك - أكثر من 100+ خبير</p></header>
<div class="wrap">

<div class="card">
<img src="https://i.pravatar.cc/150?img=47">
<div>
<h3>سلمى - خبيرة تطوير الذات</h3>
<p>جلسة 30 دقيقة - <span class="price">150 درهم</span></p>
<div class="rating-box" data-expert="salma"><div class="stars"><span data-star="1">☆</span><span data-star="2">☆</span><span data-star="3">☆</span><span data-star="4">☆</span><span data-star="5">☆</span></div><small class="rating-text">قيّم هاد الخبير</small></div>
<button class="btn">احجز</button>
</div>
</div>

<div class="card">
<img src="https://i.pravatar.cc/150?img=12">
<div>
<h3>Youssef Amrani - خبير أعمال</h3>
<p>جلسة 45 دقيقة - <span class="price">200 درهم</span></p>
<div class="rating-box" data-expert="youssef"><div class="stars"><span data-star="1">☆</span><span data-star="2">☆</span><span data-star="3">☆</span><span data-star="4">☆</span><span data-star="5">☆</span></div><small class="rating-text">قيّم هاد الخبير</small></div>
<button class="btn">احجز</button>
</div>
</div>

<div class="card">
<img src="https://i.pravatar.cc/150?img=33">
<div>
<h3>أمين الإدريسي - خبير تسويق</h3>
<p>جلسة 30 دقيقة - <span class="price">180 درهم</span></p>
<div class="rating-box" data-expert="amin"><div class="stars"><span data-star="1">☆</span><span data-star="2">☆</span><span data-star="3">☆</span><span data-star="4">☆</span><span data-star="5">☆</span></div><small class="rating-text">قيّم هاد الخبير</small></div>
<button class="btn">احجز</button>
</div>
</div>

</div>
<script>
document.querySelectorAll('.rating-box').forEach(box=>{
 const expert=box.dataset.expert;
 const stars=box.querySelectorAll('[data-star]');
 const text=box.querySelector('.rating-text');
 const saved=localStorage.getItem('waqti_'+expert);
 if(saved){show(saved); text.textContent='شكرا! قيّمتي بـ '+saved+' ⭐';}
 stars.forEach(s=>{ s.onclick=()=>{ const v=s.dataset.star; localStorage.setItem('waqti_'+expert,v); show(v); text.textContent='شكرا! قيّمتي بـ '+v+' ⭐'; }; });
 function show(v){ stars.forEach(s=>{ const on=s.dataset.star<=v; s.textContent=on?'★':'☆'; s.classList.toggle('on',on); }); }
});
</script>
</body>
</html>
