<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وقتي - Waqti | دليل الحرفيين بالمغرب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-extrabold tracking-wide">🛠️ وقتي <span class="text-blue-200 text-lg font-normal">| Waqti</span></span>
            </div>
            <div class="flex gap-2">
                <button onclick="switchTab('search')" id="btn-tab-search" class="bg-white text-blue-600 px-3 py-1.5 rounded-lg text-sm font-bold shadow transition">ابحث عن حرفي</button>
                <button onclick="switchTab('register')" id="btn-tab-register" class="bg-blue-700 hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition">+ سجل كحرفي</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-6 flex-grow max-w-4xl">

        <!-- قسم البحث عن حرفي -->
        <section id="section-search" class="space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h1 class="text-xl font-bold text-gray-800 mb-4">ابحث عن أفضل الحرفيين في مدينتك</h1>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="search-input" onkeyup="filterArtisans()" placeholder="ابحث بالاسم أو التخصص..." class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <select id="filter-job" onchange="filterArtisans()" class="w-full p-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">كل الحرف والتخصصات</option>
                        <option value="سباك (بلومبي)">سباك (بلومبي)</option>
                        <option value="كهربائي">كهربائي</option>
                        <option value="نجار">نجار</option>
                        <option value="صباغ">صباغ</option>
                        <option value="بناء">بناء</option>
                        <option value="حداد">حداد</option>
                        <option value="ميكانيكي">ميكانيكي</option>
                        <option value="خياط / خياطة">خياط / خياطة</option>
                        <option value="إصلاح الأجهزة المنزلية">إصلاح الأجهزة المنزلية</option>
                        <option value="تنظيف وصيانة">تنظيف وصيانة</option>
                        <option value="أخرى">أخرى</option>
                    </select>

                    <select id="filter-city" onchange="filterArtisans()" class="w-full p-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">كل المدن المغربية</option>
                        <option value="مكناس">مكناس</option>
                        <option value="فاس">فاس</option>
                        <option value="الرباط">الرباط</option>
                        <option value="الدار البيضاء">الدار البيضاء</option>
                        <option value="مراكش">مراكش</option>
                        <option value="طنجة">طنجة</option>
                        <option value="أكادير">أكادير</option>
                        <option value="وجدة">وجدة</option>
                        <option value="القنيطرة">القنيطرة</option>
                        <option value="تطوان">تطوان</option>
                        <option value="المحمدية">المحمدية</option>
                        <option value="بني ملال">بني ملال</option>
                        <option value="الناظور">الناظور</option>
                        <option value="الجديدة">الجديدة</option>
                        <option value="آسفي">آسفي</option>
                        <option value="العيون">العيون</option>
                    </select>
                </div>
            </div>

            <!-- مؤشر التحميل -->
            <div id="loading-spinner" class="text-center py-10">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
                <p class="text-gray-500 mt-2 text-sm">جاري تحميل قائمة الحرفيين...</p>
            </div>

            <!-- قائمة الحرفيين -->
            <div id="artisans-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

            <!-- رسالة عدم وجود نتائج -->
            <div id="no-results" class="hidden text-center py-12 bg-white rounded-2xl border border-gray-100">
                <p class="text-gray-500 text-lg">لا يوجد حرفيون مطابقون لبحثك حالياً.</p>
                <button onclick="switchTab('register')" class="mt-3 text-blue-600 font-bold hover:underline">كن أول من يسجل في هذه الفئة!</button>
            </div>
        </section>

        <!-- قسم تسجيل حرفي جديد -->
        <section id="section-register" class="hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 max-w-xl mx-auto">
                <h2 class="text-xl font-bold text-gray-800 mb-2">تسجيل حساب حرفي جديد</h2>
                <p class="text-gray-500 text-sm mb-6">أضف معلوماتك ليتمكن الزبناء في مدينتك من التواصل معك مباشرة.</p>

                <form id="register-form" onsubmit="submitArtisan(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">1. الاسم الشخصي *</label>
                            <input type="text" id="reg-fname" required placeholder="مثال: أحمد" class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">2. الكنية (النسب) *</label>
                            <input type="text" id="reg-lname" required placeholder="مثال: العلوي" class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">3. الحرفة / التخصص *</label>
                        <select id="reg-job" required class="w-full p-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">اختر حرفتك...</option>
                            <option value="سباك (بلومبي)">سباك (بلومبي)</option>
                            <option value="كهربائي">كهربائي</option>
                            <option value="نجار">نجار</option>
                            <option value="صباغ">صباغ</option>
                            <option value="بناء">بناء</option>
                            <option value="حداد">حداد</option>
                            <option value="ميكانيكي">ميكانيكي</option>
                            <option value="خياط / خياطة">خياط / خياطة</option>
                            <option value="إصلاح الأجهزة المنزلية">إصلاح الأجهزة المنزلية</option>
                            <option value="تنظيف وصيانة">تنظيف وصيانة</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">4. المدينة *</label>
                        <select id="reg-city" required class="w-full p-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">اختر مدينتك...</option>
                            <option value="مكناس">مكناس</option>
                            <option value="فاس">فاس</option>
                            <option value="الرباط">الرباط</option>
                            <option value="الدار البيضاء">الدار البيضاء</option>
                            <option value="مراكش">مراكش</option>
                            <option value="طنجة">طنجة</option>
                            <option value="أكادير">أكادير</option>
                            <option value="وجدة">وجدة</option>
                            <option value="القنيطرة">القنيطرة</option>
                            <option value="تطوان">تطوان</option>
                            <option value="المحمدية">المحمدية</option>
                            <option value="بني ملال">بني ملال</option>
                            <option value="الناظور">الناظور</option>
                            <option value="الجديدة">الجديدة</option>
                            <option value="آسفي">آسفي</option>
                            <option value="العيون">العيون</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">5. رقم الهاتف (واتساب) *</label>
                            <input type="tel" id="reg-phone" required placeholder="مثال: 0612345678" class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">6. الثمن التقريبي (درهم)</label>
                            <input type="text" id="reg-price" placeholder="مثال: ابتداءً من 100 درهم" class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">7. نبذة عن خدماتك وخبرتك *</label>
                        <textarea id="reg-desc" rows="3" required placeholder="اذكر تفاصيل الخدمات التي تقدمها وسنوات الخبرة..." class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">8. اختر صورة شخصية أو لأعمالك من جهازك</label>
                        <input type="file" id="reg-photo-file" accept="image/*" class="w-full p-2 border border-gray-300 rounded-xl bg-gray-50 focus:outline-none text-sm">
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition flex justify-center items-center gap-2">
                        <span>حفظ ونشر حسابي</span>
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- الفوتر -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-gray-500 text-sm mt-10">
        جميع الحقوق محفوظة © 2026 - منصة وقتي (Waqti) للحرفيين بالمغرب
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbxW2VW6O_XIaONtxR5sbDMZHwAAGprIqzkGj863h1LnEsnDcj6bCkb0OZPUwSrban/exec";

        let allArtisans = [];

        function switchTab(tab) {
            const searchSec = document.getElementById('section-search');
            const regSec = document.getElementById('section-register');
            const btnSearch = document.getElementById('btn-tab-search');
            const btnReg = document.getElementById('btn-tab-register');

            if (tab === 'search') {
                searchSec.classList.remove('hidden');
                regSec.classList.add('hidden');
                btnSearch.className = "bg-white text-blue-600 px-3 py-1.5 rounded-lg text-sm font-bold shadow transition";
                btnReg.className = "bg-blue-700 hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition";
            } else {
                searchSec.classList.add('hidden');
                regSec.classList.remove('hidden');
                btnReg.className = "bg-white text-blue-600 px-3 py-1.5 rounded-lg text-sm font-bold shadow transition";
                btnSearch.className = "bg-blue-700 hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition";
            }
        }

        async function loadArtisans() {
            const spinner = document.getElementById('loading-spinner');
            const listContainer = document.getElementById('artisans-list');
            spinner.classList.remove('hidden');
            listContainer.innerHTML = '';

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                allArtisans = data.reverse(); 
                renderArtisans(allArtisans);
            } catch (error) {
                console.error("Error fetching data:", error);
                listContainer.innerHTML = `<div class="col-span-2 text-center text-red-500 py-6">حدث خطأ أثناء تحميل البيانات. تأكد من اتصالك بالإنترنت.</div>`;
            } finally {
                spinner.classList.add('hidden');
            }
        }

        function renderArtisans(list) {
            const container = document.getElementById('artisans-list');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            list.forEach(item => {
                if (!item.name) return;
                const cleanPhone = String(item.phone || '').replace(/\s+/g, '');
                const waPhone = cleanPhone.startsWith('0') ? '212' + cleanPhone.substring(1) : cleanPhone;
                
                // إذا كانت الصورة مرفوعة كـ Base64 أو رابط عادي يتم عرضها، وإلا يتم توليد صورة افتراضية بالحرف الأول
                const avatar = item.photo && (item.photo.startsWith('http') || item.photo.startsWith('data:image'))
                    ? item.photo 
                    : `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=2563eb&color=fff&size=128`;

                const card = `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-3">
                                <img src="${avatar}" alt="${item.name}" class="w-14 h-14 rounded-full object-cover border border-gray-200">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">${item.name}</h3>
                                    <div class="flex flex-wrap gap-1.5 mt-1">
                                        <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">${item.job || 'حرفي'}</span>
                                        <span class="bg-gray-100 text-gray-600 text-xs font-semibold px-2.5 py-0.5 rounded-full">📍 ${item.city || 'المغرب'}</span>
                                    </div>
                                </div>
                            </div>
                            <p class="text-gray-600 text-sm mb-3 line-clamp-3">${item.desc || 'لا يوجد وصف متاح.'}</p>
                        </div>
                        <div class="pt-3 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-sm font-bold text-emerald-600">${item.price ? item.price : 'الثمن حسب الاتفاق'}</span>
                            <div class="flex gap-2">
                                <a href="tel:${cleanPhone}" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">📞 اتصال</a>
                                <a href="https://wa.me/${waPhone}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">💬 واتساب</a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterArtisans() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const job = document.getElementById('filter-job').value;
            const city = document.getElementById('filter-city').value;

            const filtered = allArtisans.filter(item => {
                const matchText = (item.name && item.name.toLowerCase().includes(query)) || 
                                  (item.desc && item.desc.toLowerCase().includes(query)) ||
                                  (item.job && item.job.toLowerCase().includes(query));
                const matchJob = job === "" || item.job === job;
                const matchCity = city === "" || item.city === city;
                return matchText && matchJob && matchCity;
            });

            renderArtisans(filtered);
        }

        async function submitArtisan(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<span>جاري معالجة الصورة والحفظ...</span>`;

            const fileInput = document.getElementById('reg-photo-file');
            
            // دالة لتحويل الصورة المرفوعة إلى Base64
            const processImageAndSubmit = (photoBase64) => {
                const fullName = document.getElementById('reg-fname').value.trim() + " " + document.getElementById('reg-lname').value.trim();
                const payload = {
                    name: fullName,
                    job: document.getElementById('reg-job').value,
                    city: document.getElementById('reg-city').value,
                    phone: document.getElementById('reg-phone').value.trim(),
                    price: document.getElementById('reg-price').value.trim(),
                    desc: document.getElementById('reg-desc').value.trim(),
                    photo: photoBase64 || "",
                    isVip: false
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    alert("✅ تم تسجيل معلوماتك بنجاح! ستظهر الآن في دليل الحرفيين.");
                    document.getElementById('register-form').reset();
                    switchTab('search');
                    setTimeout(loadArtisans, 1500);
                }).catch((error) => {
                    console.error("Error submitting:", error);
                    alert("❌ حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.");
                }).finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = `<span>حفظ ونشر حسابي</span>`;
                });
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (uploadEvent) {
                    processImageAndSubmit(uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processImageAndSubmit("");
            }
        }

        window.onload = loadArtisans;
    </script>
</body>
</html>
